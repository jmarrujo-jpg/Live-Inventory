<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CSC Live Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EAEC; --panel:#FBFBFC; --ink:#161A1F; --ink-soft:#5A626C; --line:#D2D6DB;
  --brand:#1F3A5F; --brand-2:#2C5282; --accent:#E8A21A;
  --metal:#2C3E50; --metal-accent:#E8A21A;
  --plastic:#0E7C6E; --plastic-accent:#12B3A0;
  --danger:#C0392B; --ok:#2E7D48; --warn:#B26A00;
  --radius:14px; --tap:58px;
  --dept:var(--brand); --dept-accent:var(--accent); --dept-soft:#E7EDF5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.4;overscroll-behavior:none}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}

#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* top bar */
.topbar{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.topbar .dot{width:13px;height:13px;border-radius:3px;background:var(--accent);box-shadow:3px 3px 0 var(--plastic-accent);flex:none}
.topbar .title{flex:1;min-width:0}
.topbar .title h1{font-family:'Archivo';font-weight:900;font-size:19px;letter-spacing:-.02em;margin:0;line-height:1}
.topbar .title .sub{font-size:11px;opacity:.8;margin-top:3px;letter-spacing:.02em}
.topbar .who input{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;
  padding:7px 10px;font-size:13px;width:118px}
.topbar .who input::placeholder{color:rgba(255,255,255,.72)}
.count-badge{background:rgba(0,0,0,.20);border-radius:9px;padding:6px 10px;text-align:center;flex:none}
.count-badge b{display:block;font-family:'JetBrains Mono';font-size:18px;line-height:1}
.count-badge small{font-size:9px;opacity:.85;letter-spacing:.08em;text-transform:uppercase}

.body{padding:14px;flex:1;display:flex;flex-direction:column;gap:14px}

/* scan bay */
.scanbay{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 2px 0 var(--line)}
.scanbay label{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
.scan-input-wrap{position:relative;margin-top:8px}
.scan-input-wrap .readout{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dept-accent);font-family:'JetBrains Mono';font-weight:700;pointer-events:none;opacity:.55}
#scanInput{width:100%;height:var(--tap);border:2px solid var(--brand);border-radius:11px;background:#fff;
  padding:0 16px 0 40px;font-family:'JetBrains Mono';font-weight:700;font-size:22px;letter-spacing:.02em;color:var(--ink);outline:none}
#scanInput:focus{box-shadow:0 0 0 4px var(--dept-soft)}
.scan-hint{margin-top:8px;font-size:13px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;gap:10px}
.linkbtn{color:var(--brand);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:2px;cursor:pointer}

/* search */
.search-wrap{position:relative}
#searchInput{width:100%;height:50px;border:1.5px solid var(--line);border-radius:11px;padding:0 14px;background:#fff;outline:none}
#searchInput:focus{border-color:var(--brand)}
.results{position:absolute;left:0;right:0;top:54px;z-index:9;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 34px rgba(20,26,31,.18);max-height:46vh;overflow:auto}
.results .row{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.results .row:last-child{border-bottom:none}
.results .row:active{background:var(--dept-soft)}
.results .row .code{font-family:'JetBrains Mono';font-weight:700;font-size:13px;color:var(--brand)}
.results .row .code .cat{font-weight:600;opacity:.65}
.results .row .code.nocode{color:var(--ink-soft);font-style:italic}
.results .row .d{font-size:14px}
.results .empty{padding:16px;color:var(--ink-soft);text-align:center;font-size:14px}

.notfound{background:#FFF4F1;border:1px solid #F3C6BC;color:#8a2d1c;border-radius:12px;padding:14px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.notfound b{color:var(--danger)}

/* item / movement card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card-head{background:var(--dept);color:#fff;padding:14px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-head .code{font-family:'JetBrains Mono';font-weight:700;font-size:14px;color:var(--dept-accent)}
.card-head .desc{font-family:'Archivo';font-weight:700;font-size:18px;line-height:1.15;margin-top:3px}
.card-head .chip{font-size:11px;font-weight:700;background:rgba(255,255,255,.18);border-radius:6px;padding:3px 8px;white-space:nowrap;flex:none}
.card-body{padding:14px 16px 4px}

.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;padding:11px;border-radius:8px;font-weight:700;font-size:14px;color:var(--ink-soft)}
.seg button.on{background:var(--dept);color:#fff}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em}
.fld input,.fld select{height:50px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;width:100%;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--dept-soft)}
.fld input.mono{font-family:'JetBrains Mono';font-weight:600}
.fld input.big{height:58px;font-size:24px;font-weight:700;text-align:center;font-family:'JetBrains Mono'}
.arrow-row{grid-column:1/-1;display:flex;align-items:flex-end;gap:10px}
.arrow-row .fld{flex:1;margin-bottom:0}
.arrow-row .arrow{padding-bottom:14px;color:var(--ink-soft);font-size:20px;font-weight:800}

.total-strip{grid-column:1/-1;background:var(--dept);color:#fff;border-radius:11px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin:2px 0 12px}
.total-strip .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.total-strip .val{font-family:'JetBrains Mono';font-weight:800;font-size:28px;color:var(--dept-accent)}
.total-strip .val small{font-size:13px;color:#fff;opacity:.8;font-weight:600;margin-left:4px}

.prodflag{grid-column:1/-1;background:#FFF6E6;border:1px solid #F0D399;color:var(--warn);border-radius:10px;
  padding:10px 13px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;margin-bottom:12px}

.morebtn{grid-column:1/-1;margin:-2px 0 12px;font-size:13px}
.actions{display:flex;gap:10px;padding:0 16px 16px}
.btn{flex:1;height:var(--tap);border-radius:12px;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--dept);color:#fff}
.btn.primary:active{filter:brightness(.92)}
.btn.primary:disabled{opacity:.6}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);flex:0 0 92px}

/* recent */
.recent h3{font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.entry{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.entry .info{flex:1;min-width:0}
.entry .info .c{font-family:'JetBrains Mono';font-size:12px;color:var(--brand);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .info .d{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .info .m{font-size:11px;color:var(--ink-soft);margin-top:1px}
.entry .info .m .flag{color:var(--warn);font-weight:700}
.entry .qty{font-family:'JetBrains Mono';font-weight:800;font-size:18px;text-align:right;flex:none}
.entry .qty small{display:block;font-size:9px;color:var(--ink-soft);letter-spacing:.08em}
.empty-recent{color:var(--ink-soft);font-size:14px;text-align:center;padding:24px 0;border:1px dashed var(--line);border-radius:12px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ok);color:#fff;padding:14px 22px;border-radius:12px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:50;transition:transform .28s cubic-bezier(.2,.9,.3,1.2);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger)}

.buildtag{position:fixed;right:8px;bottom:6px;z-index:60;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--ink-soft);opacity:.55;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="dot"></div>
    <div class="title">
      <h1>CSC Live Inventory</h1>
      <div class="sub" id="subline">Loading…</div>
    </div>
    <div class="who">Who: <input id="counterName" placeholder="your name" autocomplete="off"></div>
    <div class="count-badge"><b id="sessCount">0</b><small>moves</small></div>
  </div>

  <div class="body">
    <div class="scanbay">
      <label>Scan or type a product</label>
      <div class="scan-input-wrap">
        <span class="readout">›</span>
        <input id="scanInput" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="scan barcode / item #, then Enter">
      </div>
      <div class="scan-hint">
        <span id="scanCountHint"></span>
        <span class="linkbtn" id="searchToggle">Search by description</span>
      </div>
      <div class="search-wrap hide" id="searchWrap" style="margin-top:10px">
        <input id="searchInput" placeholder="type any part of the description or code" autocomplete="off">
        <div class="results hide" id="results"></div>
      </div>
    </div>

    <div id="notFound" class="notfound hide"></div>
    <div id="cardMount"></div>

    <div class="recent">
      <h3>This session</h3>
      <div id="recentList"><div class="empty-recent">Saved moves will appear here.</div></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div class="buildtag" id="buildTag"></div>

<script>
/* ===== Backend config ===== */
var API_URL = 'https://live-inventory.jmarrujo.workers.dev';  // your Worker URL (see HOSTING.md)
var API_SECRET = '';   // set only if you set API_TOKEN on the Worker
var APP_VERSION = 'v4-live';

function callApi(fn, args){
  return fetch(API_URL, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({fn:fn, args:args||[], secret:API_SECRET})
  })
  .then(function(r){ return r.json(); })
  .then(function(j){ if(!j || j.ok!==true) throw new Error((j && j.error) ? j.error : 'Request failed'); return j.result; });
}

var DATA = {ends:[], cans:[], plastics:[]};
var BUILDINGS = [];
</script>
<script>
/* ===== App logic ===== */
const state = { product:null, entries:[] };
const $ = id => document.getElementById(id);
const norm = s => (s||'').toString().trim().toUpperCase();
const asNum = v => { const n = parseFloat(v); return isNaN(n)?0:n; };
const esc = s => (s||'').toString().replace(/[&<>"'`\\]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;','\\':'&#92;'}[c]));

/* one merged catalog + a code index over the scan code */
function allItems(){ return DATA.ends.concat(DATA.cans, DATA.plastics); }
var IDX = {};
function buildIndex(){ IDX = {}; allItems().forEach(it=>{ if(it.code) IDX[norm(it.code)] = it; }); }

/* ---- scan / lookup ---- */
$('scanInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doScan(); } });
function doScan(){
  const raw = $('scanInput').value.trim();
  if(!raw) return;
  const it = IDX[norm(raw)];
  if(it){ selectItem(it); $('scanInput').value=''; }
  else showNotFound(raw);
}
function focusScan(){ setTimeout(()=>$('scanInput').focus(),60); }
function showNotFound(code){
  const nf = $('notFound');
  nf.classList.remove('hide');
  nf.innerHTML = '<span>⚠</span><div><b>“'+esc(code)+'” not found.</b><br>Check the code, or <span class="linkbtn" id="nfSearch">search by description</span>.</div>';
  const btn = document.getElementById('nfSearch');
  if(btn) btn.onclick = ()=>{ openSearch(); $('searchInput').value=code; runSearch(); };
  clearCardOnly();
}

/* ---- search ---- */
$('searchToggle').onclick = ()=> $('searchWrap').classList.contains('hide') ? openSearch() : closeSearch();
function openSearch(){ $('searchWrap').classList.remove('hide'); $('searchToggle').textContent='Hide search'; setTimeout(()=>$('searchInput').focus(),40); }
function closeSearch(){ $('searchWrap').classList.add('hide'); $('searchToggle').textContent='Search by description'; $('results').classList.add('hide'); $('searchInput').value=''; }
$('searchInput').addEventListener('input', runSearch);
function runSearch(){
  const q = norm($('searchInput').value);
  const box = $('results');
  if(q.length<1){ box.classList.add('hide'); return; }
  const hits = allItems().filter(it=> norm(it.desc).includes(q) || norm(it.code).includes(q)).slice(0,40);
  if(!hits.length){ box.innerHTML='<div class="empty">No matches</div>'; box.classList.remove('hide'); return; }
  box.innerHTML='';
  hits.forEach(it=>{
    const row = document.createElement('div'); row.className='row';
    row.innerHTML = '<span class="code '+(it.code?'':'nocode')+'">'+(it.code?esc(it.code):'no barcode')+' <span class="cat">· '+esc(it.cat)+'</span></span><span class="d">'+esc(it.desc)+'</span>';
    row.onclick = ()=>{ selectItem(it); closeSearch(); };
    box.appendChild(row);
  });
  box.classList.remove('hide');
}

/* ---- building option lists ---- */
function buildingOptions(selectedName){
  return BUILDINGS.map(b=>'<option value="'+esc(b.name)+'"'+(b.name===selectedName?' selected':'')+'>'+esc(b.name)+(b.production?' (production)':'')+'</option>').join('');
}

/* ---- select product -> movement card ---- */
function selectItem(it){
  $('notFound').classList.add('hide');
  state.product = it;
  const per = (it.perUnit===''||it.perUnit==null) ? '' : it.perUnit;
  $('cardMount').innerHTML =
   '<div class="card">'+
    '<div class="card-head">'+
      '<div><div class="code">'+(it.code?esc(it.code):'— no barcode —')+'</div><div class="desc">'+esc(it.desc)+'</div></div>'+
      '<div class="chip">'+esc(it.cat)+' · '+esc(it.kind)+'</div>'+
    '</div>'+
    '<div class="card-body">'+
      '<div class="seg"><button id="segPallets" class="on" type="button">Pallets</button><button id="segEach" type="button">Each</button></div>'+
      '<div class="grid">'+
        '<div class="fld" id="perWrap"><label>Units / pallet</label><input id="f_per" class="mono" inputmode="numeric" value="'+esc(per)+'"></div>'+
        '<div class="fld"><label id="qtyLabel">Pallets</label><input id="f_qty" class="big" inputmode="decimal" value="0" onfocus="this.select()"></div>'+

        '<div class="total-strip"><span class="lbl">Total units</span><span class="val"><span id="totalVal">0</span><small>units</small></span></div>'+

        '<div class="arrow-row">'+
          '<div class="fld"><label>From</label><select id="f_from"><option value="">— pick —</option>'+buildingOptions()+'</select></div>'+
          '<div class="arrow">→</div>'+
          '<div class="fld"><label>To</label><select id="f_to"><option value="">— pick —</option>'+buildingOptions()+'</select></div>'+
        '</div>'+

        '<div class="prodflag hide" id="prodFlag">↻ This will be flagged <b style="margin:0 4px">In Production</b></div>'+

        '<div class="morebtn"><span class="linkbtn" id="moreToggle">+ Add location / note</span></div>'+
        '<div class="fld hide morefld"><label>From location (optional)</label><input id="f_floc" placeholder="e.g. M-12"></div>'+
        '<div class="fld hide morefld"><label>To location (optional)</label><input id="f_tloc" placeholder="e.g. S-3"></div>'+
        '<div class="fld full hide morefld"><label>Note / reference (optional)</label><input id="f_note" placeholder="PO#, comment"></div>'+
      '</div>'+
    '</div>'+
    '<div class="actions"><button class="btn ghost" type="button" id="btnCancel">Cancel</button>'+
      '<button class="btn primary" type="button" id="btnSave">✓ Save move</button></div>'+
   '</div>';

  state.entryMethod = 'Pallets';
  $('segPallets').onclick = ()=> setEntryMethod('Pallets');
  $('segEach').onclick = ()=> setEntryMethod('Each');
  $('f_per').addEventListener('input', calc);
  $('f_qty').addEventListener('input', calc);
  $('f_to').addEventListener('change', updateProdFlag);
  $('moreToggle').onclick = ()=>{ document.querySelectorAll('.morefld').forEach(el=>el.classList.toggle('hide')); };
  $('btnCancel').onclick = clearCard;
  $('btnSave').onclick = saveMove;
  calc();
  setTimeout(()=>$('f_qty').focus(),80);
}
function setEntryMethod(m){
  state.entryMethod = m;
  $('segPallets').classList.toggle('on', m==='Pallets');
  $('segEach').classList.toggle('on', m==='Each');
  $('qtyLabel').textContent = m==='Pallets' ? 'Pallets' : 'Units (each)';
  $('perWrap').classList.toggle('hide', m!=='Pallets');
  calc();
}
function calc(){
  if(!$('f_qty')) return;
  const qty = asNum($('f_qty').value);
  const per = asNum($('f_per') ? $('f_per').value : 0);
  const total = state.entryMethod==='Pallets' ? Math.round(qty*per) : Math.round(qty);
  $('totalVal').textContent = total.toLocaleString();
}
function updateProdFlag(){
  const to = $('f_to').value;
  const b = BUILDINGS.find(x=>x.name===to);
  $('prodFlag').classList.toggle('hide', !(b && b.production));
}
function clearCardOnly(){ $('cardMount').innerHTML=''; state.product=null; }
function clearCard(){ clearCardOnly(); $('notFound').classList.add('hide'); focusScan(); }

/* ---- save ---- */
function saveMove(){
  const it = state.product; if(!it) return;
  const qty = asNum($('f_qty').value);
  const per = asNum($('f_per') ? $('f_per').value : 0);
  const total = state.entryMethod==='Pallets' ? Math.round(qty*per) : Math.round(qty);
  const from = $('f_from').value, to = $('f_to').value;
  if(total<=0){ toast('Enter a quantity greater than 0','err'); return; }
  if(!from){ toast('Pick a From building','err'); return; }
  if(!to){ toast('Pick a To building','err'); return; }
  if(from===to){ toast('From and To can’t be the same','err'); return; }

  const m = {
    user: $('counterName').value.trim(),
    barcode: it.code||'',
    product: it.code || it.desc,
    desc: it.desc,
    kind: it.cat,                       // coarse Metals / Plastics
    entryMethod: state.entryMethod,
    qtyEntered: qty,
    unitsPerPallet: state.entryMethod==='Pallets' ? per : '',
    fromBuilding: from,
    fromLocation: ($('f_floc')&&$('f_floc').value||'').trim(),
    toBuilding: to,
    toLocation: ($('f_tloc')&&$('f_tloc').value||'').trim(),
    note: ($('f_note')&&$('f_note').value||'').trim(),
    eventDate: new Date().toISOString().slice(0,10)
  };
  const btn = $('btnSave'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  callApi('logMovement',[m]).then(function(res){
    state.entries.unshift({product:m.product, desc:m.desc, from:from, to:to, total:total, flags:(res&&res.flags)||''});
    renderRecent();
    toast('Saved · '+total.toLocaleString()+' units'+((res&&res.flags)?' · '+res.flags:''));
    clearCardOnly(); focusScan();
  }).catch(function(err){
    if(btn){ btn.disabled=false; btn.textContent='✓ Save move'; }
    toast('Save failed — try again','err'); console.error(err);
  });
}

/* ---- recent ---- */
function renderRecent(){
  $('sessCount').textContent = state.entries.length;
  const el = $('recentList');
  if(!state.entries.length){ el.innerHTML='<div class="empty-recent">Saved moves will appear here.</div>'; return; }
  el.innerHTML = state.entries.map(e=>
    '<div class="entry"><div class="info">'+
      '<div class="c">'+esc(e.product)+'</div>'+
      '<div class="d">'+esc(e.desc)+'</div>'+
      '<div class="m">'+esc(e.from)+' → '+esc(e.to)+(e.flags?' · <span class="flag">'+esc(e.flags)+'</span>':'')+'</div>'+
    '</div><div class="qty">'+e.total.toLocaleString()+'<small>UNITS</small></div></div>'
  ).join('');
}

/* ---- startup ---- */
function onData(res){
  DATA = res.lookups; BUILDINGS = res.buildings || []; buildIndex();
  const n = allItems().length;
  $('subline').textContent = n+' products · '+BUILDINGS.length+' buildings';
  $('scanCountHint').textContent = n+' products loaded';
  focusScan();
}
function onDataFail(err){
  $('subline').textContent = 'Could not load — reload the page';
  $('scanCountHint').textContent = '';
  console.error(err);
}
callApi('bootstrap',[]).then(onData).catch(onDataFail);

/* ---- toast ---- */
let toastT;
function toast(msg,type){
  const t=$('toast'); t.textContent=msg; t.className='show'+(type==='err'?' err':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='',2000);
}
$('buildTag').textContent = APP_VERSION;
</script>
