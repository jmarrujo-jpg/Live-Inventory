<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CSC Live Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EAEC; --panel:#FBFBFC; --ink:#161A1F; --ink-soft:#5A626C; --line:#D2D6DB;
  --metal:#2C3E50; --metal-accent:#E8A21A; --metal-soft:#EEF1F4;
  --plastic:#0E7C6E; --plastic-accent:#12B3A0; --plastic-soft:#E4F3F1;
  --danger:#C0392B; --ok:#2E7D48;
  --radius:14px; --tap:60px;
  --dept:#2C3E50; --dept-accent:#E8A21A; --dept-soft:#EEF1F4; --dept-ink:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif; font-size:16px; line-height:1.4;
  overscroll-behavior:none;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}

/* ---------- App frame ---------- */
#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* ---------- Landing ---------- */
#landing{flex:1;display:flex;flex-direction:column;padding:26px 20px 22px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand .dot{width:14px;height:14px;border-radius:3px;background:var(--metal-accent);box-shadow:3px 3px 0 var(--plastic-accent)}
.brand .logo{width:auto;height:34px;max-width:120px;flex:none;object-fit:contain}
.brand h1{font-family:'Archivo';font-weight:900;font-size:20px;letter-spacing:-.02em;margin:0}
.brand span{color:var(--ink-soft);font-size:13px;font-weight:500}
.tagline{color:var(--ink-soft);font-size:14px;margin:2px 0 26px 26px}
.choose{flex:1;display:grid;grid-template-rows:1fr 1fr;gap:16px}
.dept-card{
  position:relative;border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:24px;text-align:left;color:#fff;transition:transform .08s ease, box-shadow .15s;
  box-shadow:0 10px 24px rgba(20,26,31,.12);
}
.dept-card:active{transform:scale(.985)}
.dept-card.metals{background:linear-gradient(150deg,#33475b,#212e3a)}
.dept-card.plastics{background:linear-gradient(150deg,#12988a,#0b6459)}
.dept-card .eyebrow{font-family:'JetBrains Mono';font-size:12px;letter-spacing:.22em;text-transform:uppercase;opacity:.72}
.dept-card h2{font-family:'Archivo';font-weight:900;font-size:clamp(34px,10vw,52px);letter-spacing:-.03em;margin:6px 0 0;line-height:.95}
.dept-card .sub{font-size:14px;opacity:.85;margin-top:8px;max-width:80%}
.dept-card .glyph{position:absolute;right:-8px;top:50%;transform:translateY(-50%);opacity:.14}
.dept-card .go{align-self:flex-start;margin-top:18px;background:rgba(255,255,255,.16);backdrop-filter:blur(2px);
  padding:10px 16px;border-radius:9px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.metals .eyebrow,.metals .go{color:#fff}
.metals h2{color:var(--metal-accent)}
.plastics h2{color:#c9fff5}
.landing-foot{color:var(--ink-soft);font-size:12px;text-align:center;margin-top:18px}

/* ---------- Count screen ---------- */
#count{flex:1;display:none;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:var(--dept);color:var(--dept-ink);
  padding:12px 14px calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.topbar .back{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:22px;flex:none}
.topbar .title{flex:1;min-width:0}
.topbar .title .dpt{font-family:'Archivo';font-weight:900;font-size:22px;letter-spacing:-.02em;line-height:1}
.topbar .title .who{font-size:12px;opacity:.85;margin-top:3px;display:flex;align-items:center;gap:6px}
.topbar .who input{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;
  padding:3px 8px;font-size:12px;width:120px}
.topbar .who input::placeholder{color:rgba(255,255,255,.7)}
.count-badge{background:rgba(0,0,0,.22);border-radius:9px;padding:6px 11px;text-align:center;flex:none}
.count-badge b{display:block;font-family:'JetBrains Mono';font-size:19px;line-height:1}
.count-badge small{font-size:10px;opacity:.8;letter-spacing:.08em;text-transform:uppercase}

.body{padding:14px;flex:1;display:flex;flex-direction:column;gap:14px}

/* sub-toggle for metals */
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:12px;border-radius:9px;font-weight:700;font-size:15px;color:var(--ink-soft)}
.seg button.on{background:var(--dept);color:#fff}

/* "building you're in" bar above the scanner */
.bldgbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bldgbar .bldglbl{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.bldgbar select{flex:1;height:48px;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;font-size:16px;font-weight:700;color:var(--dept)}
.bldgbar select:focus{border-color:var(--dept);outline:none}

/* scan bay - signature element */
.scanbay{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  box-shadow:0 2px 0 var(--line)}
.scanbay label{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
.scan-input-wrap{position:relative;margin-top:8px}
.scan-input-wrap .readout{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dept-accent);
  font-family:'JetBrains Mono';font-weight:700;pointer-events:none;opacity:.5}
#scanInput{width:100%;height:var(--tap);border:2px solid var(--dept);border-radius:11px;background:#fff;
  padding:0 46px 0 40px;font-family:'JetBrains Mono';font-weight:700;font-size:22px;letter-spacing:.02em;color:var(--ink);outline:none}
#scanInput:focus{box-shadow:0 0 0 4px var(--dept-soft)}
.scan-x{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.scan-hint{margin-top:8px;font-size:13px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;gap:10px}
.linkbtn{color:var(--dept);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:2px;cursor:pointer}

/* search dropdown */
.search-wrap{position:relative}
#searchInput{width:100%;height:52px;border:1.5px solid var(--line);border-radius:11px;padding:0 14px;background:#fff;outline:none}
#searchInput:focus{border-color:var(--dept)}
.results{position:absolute;left:0;right:0;top:56px;z-index:9;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:0 16px 34px rgba(20,26,31,.18);max-height:44vh;overflow:auto}
.results .row{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;cursor:pointer}
.results .row:last-child{border-bottom:none}
.results .row:active{background:var(--dept-soft)}
.results .row .code{font-family:'JetBrains Mono';font-weight:700;font-size:13px;color:var(--dept)}
.results .row .code.nocode{color:var(--ink-soft);font-style:italic}
.results .row .d{font-size:14px}
.results .empty{padding:16px;color:var(--ink-soft);text-align:center;font-size:14px}

/* item card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card-head{background:var(--dept);color:#fff;padding:14px 16px}
.card-head .code{font-family:'JetBrains Mono';font-weight:700;font-size:15px;color:var(--dept-accent)}
.card-head .desc{font-family:'Archivo';font-weight:700;font-size:19px;line-height:1.15;margin-top:3px}
.card-body{padding:14px 16px 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em;display:flex;justify-content:space-between}
.fld label .tag{font-weight:600;font-size:10px;background:var(--dept-soft);color:var(--dept);padding:1px 6px;border-radius:5px}
.fld input{height:52px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;width:100%;outline:none}
.fld input:focus{border-color:var(--dept);box-shadow:0 0 0 3px var(--dept-soft)}
.fld input.mono{font-family:'JetBrains Mono';font-weight:600}
.fld input.big{height:60px;font-size:24px;font-weight:700;text-align:center;font-family:'JetBrains Mono'}

/* number box + on-screen advance button (mobile numeric keypads have no Enter key) */
.biginput,.locrow{display:flex;gap:8px;align-items:stretch}
.biginput input,.locrow input{flex:1;min-width:0}
.locrow select{flex:0 0 108px;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:0 8px;font-size:15px;color:var(--ink);height:52px}
.locrow select:focus{border-color:var(--dept);outline:none}
.stepbtn{flex:0 0 58px;border-radius:10px;background:var(--dept);color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;cursor:pointer}
.stepbtn:active{filter:brightness(.92)}
.stepbtn.ok{background:var(--ok)}
.fld input.rodisp[readonly]{background:var(--dept-soft);border-color:transparent;color:var(--dept);font-weight:700}
/* docked number pad — slides up from the bottom like a native keyboard, only while a count box
   (Full/Extra/Location) is active. iOS won't summon its own keyboard on the programmatic focus
   after a scan, so those boxes use inputmode=none and this pad instead. */
.keypad{position:fixed;left:0;right:0;bottom:0;z-index:75;background:#e9ebee;border-top:1px solid #c7ccd1;touch-action:none;-webkit-user-select:none;user-select:none;
  padding:7px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(20,26,31,.16);
  transform:translateY(115%);transition:transform .2s ease;will-change:transform}
.keypad.show{transform:translateY(0)}
.kp-target{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:2px 4px 7px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:460px;margin-left:auto;margin-right:auto}
.kp-target b{color:var(--dept)}
.kp-calc{border:1px solid var(--dept);border-radius:8px;background:#fff;color:var(--dept);font-family:'JetBrains Mono';
  font-weight:800;font-size:12px;letter-spacing:.06em;padding:6px 12px;cursor:pointer;touch-action:manipulation}
.kp-calc:active{background:var(--dept-soft)}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:460px;margin:0 auto}
.kp-grid button{height:52px;border:1px solid #c7ccd1;border-radius:9px;background:#fff;color:var(--ink);
  font-family:'JetBrains Mono';font-weight:800;font-size:23px;display:grid;place-items:center;cursor:pointer;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;box-shadow:0 1px 0 #b8bec4}
.kp-grid button:active{background:var(--dept-soft);border-color:var(--dept)}
.kp-grid button.kp-back{color:var(--ink-soft);font-size:21px}
.kp-grid button.kp-go{background:var(--ok);border-color:var(--ok);color:#fff;font-size:19px;box-shadow:none}
/* pressed-button feedback (darken + slight shrink) for every keypad/calculator key */
.kp-grid button,.calc-grid button,.kp-calc{transition:filter .06s ease,transform .06s ease}
.kp-grid button.is-press,.calc-grid button.is-press,.kp-calc.is-press{filter:brightness(.82);transform:scale(.94)}
/* leave room to scroll the active field above the docked pad */
body.kp-open #count{padding-bottom:290px}
/* alphanumeric keyboard (check-value prompt, Weight, Type) — sits above the modal (z 80) */
.tkeypad{z-index:90}
.tk-grid{max-width:500px;margin:0 auto}
.tk-row{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
/* fixed-width keys so shorter rows stay aligned (a 10-column grid, like a real keyboard) */
.tk-grid button{flex:0 0 calc((100% - 54px)/10);height:44px;border:1px solid #c7ccd1;border-radius:7px;background:#fff;color:var(--ink);
  font-family:'JetBrains Mono';font-weight:700;font-size:17px;display:grid;place-items:center;cursor:pointer;padding:0;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;box-shadow:0 1px 0 #b8bec4;transition:filter .06s ease,transform .06s ease}
.tk-grid button:active{background:var(--dept-soft);border-color:var(--dept)}
.tk-grid button.is-press{filter:brightness(.82);transform:scale(.94)}
.tk-grid button.tk-back{flex:0 0 calc(((100% - 54px)/10)*1.6 + 6px);color:var(--ink-soft);font-size:19px}
/* bottom utility row: symbols + wide space + Done (flex, not the fixed 10-col grid) */
.tk-row.tk-util button{flex:1 1 0}
.tk-row.tk-util .tk-wide{flex:4 1 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.tk-row.tk-util .tk-go{flex:2 1 0;background:var(--ok);border-color:var(--ok);color:#fff;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
body.tk-open #count{padding-bottom:340px}
body.tk-open .modal:not(.hide){justify-content:flex-start}
body.tk-open .modal-card{margin-top:12px;margin-bottom:12px}
/* landscape / short screens: shrink the docked pads so they don't swallow the whole viewport */
@media (orientation:landscape) and (max-height:560px){
  .kp-grid button{height:40px;font-size:19px}
  .kp-target{margin-bottom:4px}
  .tk-grid button{height:34px;font-size:15px}
  .tk-row{margin-bottom:4px}
  .keypad{padding-top:5px}
  body.kp-open #count{padding-bottom:210px}
  body.tk-open #count{padding-bottom:250px}
}

.total-strip{grid-column:1/-1;background:var(--dept);color:#fff;border-radius:11px;padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;margin:2px 0 12px}
.total-strip .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.total-strip .val{font-family:'JetBrains Mono';font-weight:800;font-size:30px;color:var(--dept-accent)}
.total-strip .val small{font-size:13px;color:#fff;opacity:.8;font-weight:600;margin-left:4px}

.actions{display:flex;gap:10px;padding:0 16px 16px}
.btn{flex:1;height:var(--tap);border-radius:12px;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--dept);color:#fff}
.btn.primary:active{filter:brightness(.92)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);flex:0 0 96px}
/* mode switch (Scan item / Count by row) at the top of the count screen */
.modeseg{display:flex;gap:6px;margin:0 0 10px;padding:4px;background:#e9ebee;border-radius:12px}
.modeseg button{flex:1;height:42px;border:0;border-radius:9px;background:transparent;color:var(--ink-soft);
  font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.modeseg button.on{background:#fff;color:var(--dept);box-shadow:0 1px 3px rgba(20,26,31,.12)}
/* "last counted here" hint on the card */
.loghint{background:var(--dept-soft);border:1px solid transparent;border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.35;color:var(--ink)}
.loghint.warn{background:#FFF8E6;border-color:var(--metal-accent)}
.loghint .lh-i{margin-right:4px}
.loghint .lh-bd{color:var(--ink-soft);font-weight:600}
.loghint .lh-note{font-size:11px;color:var(--ink-soft);font-weight:600}
.loghint b.up{color:#1b7f3b} .loghint b.down{color:#c0392b}
/* Count-by-row panel */
.rowpanel{margin:2px 0 6px}
.rowpick label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:0 2px 5px}
.rowpick .locrow{display:flex;gap:8px}
.rowpick select{flex:0 0 128px;height:52px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px;background:#fff}
.rowpick input{flex:1;height:52px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:#fff}
.rowpick .rowgo{flex:0 0 88px;height:52px}
.rowstep{display:flex;gap:8px;margin-top:8px}
.rowstep .btn{flex:1;height:46px;font-family:'JetBrains Mono';font-weight:800;font-size:15px}
.rowstep .rowcalc{flex:0 0 56px;font-size:20px}
.rowinfo{margin:12px 2px 8px}
.rowhdr{font-size:13px;color:var(--ink)}
.rowhint{font-size:13px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.rowhint.warn{background:#FFF8E6;border-color:var(--metal-accent);color:var(--ink)}
.rowlist{display:flex;flex-direction:column;gap:8px}
.rowitem{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.rowitem.done{background:var(--dept-soft);border-color:transparent}
.ri-main{flex:1;min-width:0}
.ri-name{font-weight:800;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.ri-btns{display:flex;gap:6px;flex:0 0 auto}
.ri-done{font-weight:800;color:var(--dept);font-family:'JetBrains Mono';font-size:14px;flex:0 0 auto}
.btn.tiny{flex:0 0 auto;height:38px;min-width:52px;padding:0 12px;border-radius:9px;font-size:14px;font-weight:800;
  border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.btn.tiny.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.tiny.x{flex:0 0 40px;min-width:40px;color:var(--ink-soft)}
.rowadd{margin-top:4px;width:100%}

/* recent list */
.recent{margin-top:2px}
.recent h3{font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.recent h3 .acts{display:flex;gap:14px}
.recent h3 .exp{color:var(--dept);text-decoration:underline;text-underline-offset:2px;font-size:12px;cursor:pointer}
.entry{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px;
  display:flex;align-items:center;gap:12px}
.entry .info{flex:1;min-width:0}
.entry .info .c{font-family:'JetBrains Mono';font-size:12px;color:var(--dept);font-weight:700}
.entry .info .d{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .info .m{font-size:11px;color:var(--ink-soft);margin-top:1px}
.entry .info .loc{font-size:12px;color:var(--dept);font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .qty{font-family:'JetBrains Mono';font-weight:800;font-size:18px;text-align:right;flex:none}
.entry .qty small{display:block;font-size:9px;color:var(--ink-soft);letter-spacing:.08em}
.entry .editbtn{flex:none;width:40px;height:40px;border-radius:9px;background:var(--dept-soft);color:var(--dept);
  font-size:17px;display:grid;place-items:center;cursor:pointer}
.entry .editbtn:active{filter:brightness(.94)}
.btn.danger{background:transparent;border:1.5px solid #E4B4AB;color:var(--danger);flex:0 0 auto;padding:0 16px}
.cardDel{position:absolute;top:12px;right:14px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;
  font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer}
.card-head{position:relative}
.empty-recent{color:var(--ink-soft);font-size:14px;text-align:center;padding:24px 0;border:1px dashed var(--line);border-radius:12px}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);
  background:var(--ok);color:#fff;padding:14px 22px;border-radius:12px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.25);
  z-index:50;transition:transform .28s cubic-bezier(.2,.9,.3,1.2);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger)}

.notfound{background:#FFF4F1;border:1px solid #F3C6BC;color:#8a2d1c;border-radius:12px;padding:14px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.notfound b{color:var(--danger)}
.nf-add{display:block;height:44px;padding:0 18px;margin-top:12px;font-size:15px}

/* build/version tag */
.buildtag{position:fixed;right:8px;bottom:6px;z-index:60;font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--ink-soft);opacity:.55;pointer-events:none}

/* fields that still need a manual entry */
.fld input.need{border-color:var(--metal-accent);background:#FFF8E6;box-shadow:0 0 0 3px rgba(232,162,26,.18)}

/* freeze the page behind an open calculator/modal (the overlay scrolls itself if it's tall) */
/* Freeze the page WITHOUT moving it: body is pinned at its current offset (top set from JS). */
html.modal-lock body{position:fixed;left:0;right:0;width:100%;overflow:hidden}
/* check-value prompt modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,26,31,.5);display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;padding:20px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* margin:auto centers the card when it fits, but lets it scroll from the top when it's taller than the screen */
.modal-card{background:var(--panel);border-radius:var(--radius);width:100%;max-width:380px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.35);margin:auto 0}
.modal-title{font-family:'Archivo';font-weight:900;font-size:22px;color:var(--dept);letter-spacing:-.01em}
.modal-hint{color:var(--ink-soft);font-size:13px;margin:6px 0 14px}
#modalInput{width:100%;height:var(--tap);border:2px solid var(--dept);border-radius:11px;background:#fff;padding:0 16px;
  font-family:'JetBrains Mono';font-weight:700;font-size:22px;letter-spacing:.02em;color:var(--ink);outline:none}
#modalInput:focus{box-shadow:0 0 0 4px var(--dept-soft)}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{height:52px}
/* department Append/Delete gate */
.gate-actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.gate-actions .btn{width:100%;height:56px;flex:none}
.gate-warn{background:#FDECEA;border:1px solid #E4B4AB;color:#8a2b1e;padding:12px 14px;border-radius:11px;font-size:14.5px;line-height:1.45;margin:2px 0 2px}
.gate-warn b{color:#7a1e12}

/* clear (X) button inside the search field */
.search-field{position:relative}
.search-field #searchInput{padding-right:44px}
.search-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:none;border-radius:50%;
  background:var(--line);color:var(--ink-soft);font-size:20px;line-height:1;display:none;place-items:center;cursor:pointer}
.search-x.show{display:grid}
.search-x:active{filter:brightness(.9)}

.ico-calc{display:inline-block;vertical-align:middle}
.kp-calc .ico-calc{width:15px;height:15px;margin-right:5px;margin-top:-2px}

/* calculator modal */
.calc-card{max-width:340px}
.calc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calc-x{border:none;background:none;font-size:28px;line-height:1;color:var(--ink-soft);cursor:pointer;padding:0 4px}
#calcDisplay{width:100%;height:54px;border:2px solid var(--line);border-radius:11px;background:#fff;padding:0 14px;text-align:right;
  font-family:'JetBrains Mono';font-weight:700;font-size:22px;color:var(--ink);outline:none}
#calcDisplay:focus{border-color:var(--dept)}
.calc-result{text-align:right;font-family:'JetBrains Mono';font-weight:800;font-size:30px;color:var(--dept);min-height:38px;margin:6px 2px}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-grid button{height:54px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);
  font-family:'JetBrains Mono';font-weight:800;font-size:22px;display:grid;place-items:center;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.calc-grid button:active{background:var(--dept-soft);border-color:var(--dept)}
.calc-grid button.op{color:var(--dept)}
.calc-grid button.eq{background:var(--dept);border-color:var(--dept);color:#fff}
.calc-grid button.clr{color:#b23b3b}
.calc-use{margin-top:10px}
.calc-use .btn{width:100%;height:50px}
.calc-hist{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.calc-hist .lbl{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.calc-hist .h{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:9px;background:var(--dept-soft);
  margin-bottom:5px;cursor:pointer;font-family:'JetBrains Mono';font-size:13px}
.calc-hist .h .ex{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-hist .h .rv{color:var(--dept);font-weight:800}
.calc-hist .none{color:var(--ink-soft);font-size:12px}

@media (min-width:560px){ .dept-card .sub{max-width:60%} }
</style>
</head>

</div>

<script>
/* ====== Backend config ======
   This page is static (GitHub Pages). It talks to a Cloudflare Worker that reads/writes the
   Google Sheet. Set API_URL to your Worker URL (see HOSTING.md). API_SECRET only if you set
   API_TOKEN on the Worker. */
var API_URL = 'https://live-inventory.jmarrujo.workers.dev';
var API_SECRET = '';

/* Bump this on every page change — the number shows in the bottom-right corner so you can
   confirm a reload actually picked up the latest page (an old cached page has no tag). */
var APP_VERSION = 'v55-onescan';

/* Call a backend function: callApi('fn', [arg1, arg2]) -> Promise(result). */
function callApi(fn, args){
  return fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({fn:fn, args:args||[], secret:API_SECRET})
  })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if(!j || j.ok!==true) throw new Error((j && j.error) ? j.error : 'Request failed');
    return j.result;
  });
}

/* ====== DATA loaded live from the Google Sheet lookup tabs ====== */
var DATA = {ends:[],cans:[],plastics:[]};
</script>
<script>
/* ====== APP LOGIC ====== */
const state = { dept:null, metalKind:'ends', entries:{metals:[], plastics:[]}, current:null, building:'', mode:'scan' };
var rowSkips = {};   // per-location products the user marked "not here" in Count-by-Row (transient)

/* Buildings loaded live from the Movements workbook's Buildings tab: {name, prefix, production}.
   Movements are building -> building: From is the "building you're in", To is picked on the card. */
var BUILDINGS = [];
function buildingNameOptions(sel){
  return ['<option value="">— pick —</option>'].concat(
    BUILDINGS.map(function(b){ return '<option value="'+esc(b.name)+'"'+(b.name===sel?' selected':'')+'>'+esc(b.name)+(b.production?' (production)':'')+'</option>'; })
  ).join('');
}
function buildingByName(n){ return BUILDINGS.find(function(b){ return b.name===n; }); }
/* Card "To building" changed: show the "In Production" note when the destination is a production env. */
function onCardTo(v){ const el=$('prodHint'); if(el){ const b=buildingByName(v); el.hidden = !(b && b.production); } }
// Compose the location from the building select + number box (also accepts typing "m03"/"mt12").
function composeLoc(){
  const sel = $('f_bldg') ? $('f_bldg').value : '';
  const raw = ($('f_loc') && $('f_loc').value || '').trim();
  const m = /^([A-Za-z]{1,2})[\s-]?(\d+)$/.exec(raw);   // allow "m03", "mt12" typed directly
  let letter = sel, digits;
  if(m){ letter = m[1].toUpperCase(); digits = m[2]; }
  else { digits = raw.replace(/\D/g,''); }
  if(!digits) return letter || '';
  return (letter ? letter+'-' : '') + digits.padStart(3,'0');
}
// Split a stored "M-003" back into building + number for editing.
function parseLoc(loc){
  const m = /^([A-Za-z]{1,2})-?(\d+)$/.exec(String(loc||'').trim());
  if(m) return { bldg:m[1].toUpperCase(), num:String(Number(m[2])) };
  return { bldg:'', num:String(loc||'') };
}
// Fill the top "building you're in" dropdown and select the current building.
function initBuildingSelect(){
  const sel=$('topBldg'); if(!sel) return;
  sel.innerHTML=buildingNameOptions(state.building||'');
  sel.value=state.building||'';
}
// Top dropdown changed: this is the building you're in; new scans auto-fill it.
function setBuilding(v){
  state.building=v; persistSession();
  const top=$('topBldg'); if(top && top.value!==v) top.value=v;
  if(state.editIndex==null){ const fb=$('f_bldg'); if(fb) fb.value=v; } // don't touch an entry being edited
}
// Card's location dropdown changed. For a NEW entry, keep the "building you're in" in sync;
// while editing, only change this entry (don't move the current building).
function onCardBldg(v){
  if(state.editIndex==null){ state.building=v; persistSession(); const top=$('topBldg'); if(top) top.value=v; }
  updateLogHint();   // building changed → refresh the "last counted here" hint
}

/* ---- session persistence: entries survive closing/reopening the app ---- */
const SESSION_KEY = 'cscLiveInvSession_v1';
function persistSession(){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      entries: state.entries,
      counter: $('counterName') ? $('counterName').value : '',
      lastDept: state.dept,
      metalKind: state.metalKind,
      building: state.building
    }));
  }catch(e){ /* storage disabled/full — just skip persisting */ }
}
function loadSession(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
    if(!s) return null;
    if(s.entries){
      state.entries.metals   = Array.isArray(s.entries.metals)   ? s.entries.metals   : [];
      state.entries.plastics = Array.isArray(s.entries.plastics) ? s.entries.plastics : [];
    }
    if(s.metalKind) state.metalKind = s.metalKind;
    if(s.building) state.building = s.building;
    return s;
  }catch(e){ return null; }
}
function restoreSession(s){
  if(!s) return;
  // Always start on the landing screen; just restore the counter name. Entries stay loaded in
  // state, so tapping a section shows the counts you'd already saved this session.
  if($('counterName') && typeof s.counter==='string') $('counterName').value = s.counter;
}

const $ = id => document.getElementById(id);
const norm = s => (s||'').toString().trim().toUpperCase();
const asNum = v => { const n = parseFloat(v); return isNaN(n)?0:n; };
const esc = s => (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* A check value marks a cell that needs a manual entry. The prompt text is whatever is wrapped
   in !!! ... !!! (e.g. "!!!ADD COLOR!!!" -> "ADD COLOR", "!!!s-1 or 3? (1 or 3)!!!" ->
   "s-1 or 3? (1 or 3)"). Bare "ADD X" / "INPUT" are also accepted.
   Returns the prompt to show, or null if the cell is a normal value. */
function checkPrompt(v){
  const s = (v==null?'':String(v));
  const m = /!!!\s*([\s\S]+?)\s*!!!/.exec(s);
  if(m) return m[1].trim();
  if(/\bINPUT\b/i.test(s)) return 'Enter value';
  const a = /ADD\s+([A-Za-z]+)/i.exec(s);
  if(a) return 'Add '+a[1].toLowerCase();
  return null;
}
function isCheckValue(v){ return checkPrompt(v)!==null; }

/* build code->item index per list */
function indexOf(list){ const m={}; list.forEach(it=>{ if(it.code) m[norm(it.code)]=it; }); return m; }
var IDX = { ends:{}, cans:{}, plastics:{} };
function buildIndex(){ IDX = { ends:indexOf(DATA.ends), cans:indexOf(DATA.cans), plastics:indexOf(DATA.plastics) }; buildIndexAll(); }

/* ONE combined catalog across all three lists — a single scan/search box hits every list at
   once, and whichever list the match came from decides its category (Ends / Cans / Plastics).
   No department tabs; the scan auto-detects. First list wins if a code somehow appears twice. */
const LIST_ORDER = ['ends','cans','plastics'];
var IDXALL = {};                         // codeNorm -> {it, key}
function buildIndexAll(){
  IDXALL = {};
  LIST_ORDER.forEach(function(key){
    (DATA[key]||[]).forEach(function(it){ if(it.code){ const k=norm(it.code); if(!IDXALL[k]) IDXALL[k]={it:it,key:key}; } });
  });
}
function allProductCount(){ return DATA.ends.length + DATA.cans.length + DATA.plastics.length; }
// Point state at the list a scanned/picked item came from, so the card renders the right fields.
function setCategoryFromKey(key){
  if(key==='plastics'){ state.dept='plastics'; }
  else { state.dept='metals'; state.metalKind = (key==='cans'?'cans':'ends'); }
  applyDeptTheme();
  const t=$('deptTitle'); if(t) t.textContent = state.dept==='plastics' ? 'Plastics' : ('Metals / '+(state.metalKind==='cans'?'Cans':'Ends'));
}
// Theme colors + topbar title follow the last scanned item's category (cosmetic only).
function applyDeptTheme(){
  const dept=state.dept||'metals';
  document.documentElement.style.setProperty('--dept', dept==='plastics'?'var(--plastic)':'var(--metal)');
  document.documentElement.style.setProperty('--dept-accent', dept==='plastics'?'var(--plastic-accent)':'var(--metal-accent)');
  document.documentElement.style.setProperty('--dept-soft', dept==='plastics'?'var(--plastic-soft)':'var(--metal-soft)');
}
// Skip the landing screen — the app opens straight on the single combined scan box.
function enterApp(){
  state.dept = state.dept || 'metals';
  state.metalKind = state.metalKind || 'ends';
  applyDeptTheme();
  const t=$('deptTitle'); if(t) t.textContent='Live Inventory';
  const ls=$('landing'); if(ls) ls.style.display='none';
  $('count').style.display='flex';
  const seg=$('metalSeg'); if(seg) seg.classList.add('hide');   // no Ends/Cans sub-tabs
  state.mode='scan';
  const tb=$('topBldg'); if(tb) tb.value=state.building||'';
  clearCardOnly(); renderRecent(); updateHints(); syncMode();
  focusScan();
}

function activeList(){
  if(state.dept==='plastics') return DATA.plastics;
  return state.metalKind==='ends' ? DATA.ends : DATA.cans;
}
function activeIdx(){
  if(state.dept==='plastics') return IDX.plastics;
  return state.metalKind==='ends' ? IDX.ends : IDX.cans;
}
function activeEntries(){ return state.dept==='plastics'?state.entries.plastics:state.entries.metals; }

/* ---- navigation ---- */
// Default counter per department — mostly two people. Prefilled but fully editable; a name the
// user typed themselves is left alone (we only overwrite a blank or the other dept's default).
const DEPT_COUNTER = { metals:'Jonathan', plastics:'Lisa' };
function autofillCounter(dept){
  const def = DEPT_COUNTER[dept]; if(!def) return;
  const el = $('counterName'); if(!el) return;
  const cur = el.value.trim();
  const known = Object.keys(DEPT_COUNTER).map(k=>DEPT_COUNTER[k]);
  if(cur==='' || known.indexOf(cur)!==-1){ el.value=def; persistSession(); }
}
function openDept(dept){
  state.dept = dept;
  autofillCounter(dept);
  document.documentElement.style.setProperty('--dept', dept==='plastics'?'var(--plastic)':'var(--metal)');

$('scanInput').addEventListener('keydown', e=>{

});
// Auto-open once the scanned/typed value matches a real code (no need to press Enter).
// A short debounce lets a barcode scanner finish "typing" the whole code first. We only
// open on an exact match, so a partial code while typing never shows a "not found" error.
let scanTimer;
$('scanInput').addEventListener('input', ()=>{
  $('scanX').classList.toggle('show', $('scanInput').value.trim().length>0);
  clearTimeout(scanTimer);
  scanTimer=setTimeout(()=>{
    const raw=$('scanInput').value.trim();
    if(!raw) return;
    if(looksLikeDate(raw)){ clearScan(); toast('📅 Date barcode ignored — scan the product code'); return; }
    const hit=IDXALL[norm(raw)];                          // one combined catalog — Ends/Cans/Plastics
    if(hit){ setCategoryFromKey(hit.key); chooseItem(hit.it); clearScan(false); }
  }, 120);
});
function doScan(){
  const raw=$('scanInput').value.trim();
  if(!raw) return;
  const hit=IDXALL[norm(raw)];                            // a real product code always wins
  if(hit){ setCategoryFromKey(hit.key); chooseItem(hit.it); clearScan(false); return; }
  if(looksLikeDate(raw)){ clearScan(); toast('📅 Date barcode ignored — scan the product code'); return; }
  if(isQuantity(raw)){ clearScan(); toast('🔢 Quantity ignored — scan the product code'); return; }
  showNotFound(raw);
}
// A quantity barcode is just a plain number (optionally with commas/spaces, e.g. "1,200"). Since
// every real product code lives in the lookup, a not-found plain number is a quantity, not a code,
// so we discard it and let the user scan the product again. (Codes with letters — 25068-W,
// 401 OVERCAP… — never match this, so "Add manually" still works for them.)
function isQuantity(s){ return /^\d[\d\s,]*$/.test(s); }
// Clear the scan box (X button + after a match/date). refocus=false skips stealing focus
// from a freshly-opened card.
function clearScan(refocus){ const el=$('scanInput'); if(!el) return; el.value=''; $('scanX').classList.remove('show'); if(refocus!==false) el.focus(); }
// The barcodes have a date label right next to the product label, so a mis-scan lands the date
// in the box. Convention is "MM/DD/YYYY 01" (01/02/03 = shift), but it's applied inconsistently
// (separators/spacing vary). We anchor on a real 4-digit year (19xx/20xx) surrounded by two date
// separators so a hyphenated part number like "12-34-5678" is NOT mistaken for a date.
function looksLikeDate(s){
  return /\b\d{1,2}\s*[\/\-.]\s*\d{1,2}\s*[\/\-.]\s*(19|20)\d{2}\b/.test(s)   // MM/DD/YYYY
      || /\b(19|20)\d{2}\s*[\/\-.]\s*\d{1,2}\s*[\/\-.]\s*\d{1,2}\b/.test(s);  // YYYY/MM/DD
}
function showNotFound(code){
  $('notFound').classList.remove('hide');

    <span class="linkbtn" onclick="openSearchWith('${esc(code)}')">Search by description</span>
    <button type="button" class="btn primary nf-add" onclick="addManual('${esc(code)}')">➕ Add manually</button></div>`;

/* ---- read-only history log ("last counted here") ---- */
// Loaded once from the SEPARATE log workbook via the worker's getLogs. Never written to.
var LOG={metals:[],plastics:[]}, LOGIDX={metals:{},plastics:{}}, LOG_LOADED=false, LOG_ERR=false;
var LOG_ON=true;   // "compare to last count" is always on
function loadLogs(){
  return callApi('getLogs',[]).then(function(res){
    LOG.metals=(res&&res.metals)||[]; LOG.plastics=(res&&res.plastics)||[];
    buildLogIndex(); LOG_LOADED=true; LOG_ERR=false; updateLogHint(); if(state.mode==='row') renderRowPanel();
  }).catch(function(err){ LOG_ERR=true; LOG_LOADED=false; if(state.mode==='row') renderRowPanel(); console.warn('log load failed',err); });
}
// Split a total into full units/pallets + loose, using the item's per-pallet number.
function unitsBreakdown(total, per){
  total=Number(total)||0; per=Number(per)||0;
  if(per>0){ const full=Math.floor(total/per); const loose=total-full*per;
    return full+' full'+(loose>0?' + '+loose.toLocaleString()+' loose':''); }
  return null;
}
// Location key that matches the app's own normalization (building + numeric value, leading zeros dropped).
function logLocKey(loc){ const p=parseLoc(loc); return p.bldg+'#'+(p.num||''); }
// Parse a log Count Date (ISO "2026-09-03", "9/3/2026", or anything Date.parse handles) to a
// comparable number so we can pick the newest.
function logDateVal(s){
  s=String(s||'').trim(); if(!s) return 0;
  var m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m) return Date.UTC(+m[1],+m[2]-1,+m[3]);
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(s);
  if(m){ var y=+m[3]; if(y<100) y+=2000; return Date.UTC(y,+m[1]-1,+m[2]); }
  var t=Date.parse(s); return isNaN(t)?0:t;
}
function buildLogIndex(){
  ['metals','plastics'].forEach(function(dep){
    const byLoc={};
    (LOG[dep]||[]).forEach(function(r){ const k=logLocKey(r.loc); if(!k||k==='#')return; (byLoc[k]=byLoc[k]||[]).push(r); });
    // At each location keep ONLY the most-recently-counted date (older counts are superseded).
    const idx={};
    Object.keys(byLoc).forEach(function(k){
      const rows=byLoc[k];
      let maxV=0; rows.forEach(function(r){ const v=logDateVal(r.countDate); if(v>maxV) maxV=v; });
      idx[k]= maxV ? rows.filter(function(r){ return logDateVal(r.countDate)===maxV; }) : rows;
    });
    LOGIDX[dep]=idx;
  });
}
// Every logged product at a location, filtered to the active Ends/Cans kind for metals.
function logForLoc(loc){
  const dep = state.dept==='plastics'?'plastics':'metals';
  const rows=(LOGIDX[dep]||{})[logLocKey(loc)]||[];
  if(state.dept==='metals'){ const kind=state.metalKind==='cans'?'Cans':'Ends'; return rows.filter(function(r){ return !r.kind || norm(r.kind)===norm(kind); }); }
  return rows;
}
// The "last counted here" line on the card. Updates live as location / counts change.
function updateLogHint(){
  const box=$('logHint'); if(!box) return;
  if(!LOG_ON || !LOG_LOADED || !state.current){ box.hidden=true; return; }
  const code=(($('f_code')&&$('f_code').value)||state.current.code||'').trim();
  const loc=composeLoc();
  if(!loc || parseLoc(loc).num===''){ box.hidden=true; return; }
  const here=logForLoc(loc);
  if(!here.length){ box.hidden=true; return; }
  const mine=here.filter(function(r){ return norm(r.product)===norm(code) || (state.current.desc && norm(r.desc)===norm(state.current.desc)); });
  if(mine.length){
    const r=mine[0], last=mine.reduce(function(s,x){ return s+(Number(x.qty)||0); },0);
    const per=asNum($('f_per')&&$('f_per').value), full=asNum($('f_full')&&$('f_full').value), extra=asNum($('f_extra')&&$('f_extra').value);
    const cur=Math.round(full*per+extra);
    let delta='';
    if(cur>0){ const d=cur-last; delta = d===0 ? ' · <b>same as last</b>' : (d>0?' · <b class="up">+'+d.toLocaleString()+'</b>':' · <b class="down">'+d.toLocaleString()+'</b>'); }
    const bd=unitsBreakdown(last, per);
    box.innerHTML='<span class="lh-i">📋</span> Last counted here: <b>'+last.toLocaleString()+'</b> units'+(bd?' <span class="lh-bd">('+bd+')</span>':'')+(r.countDate?' · '+esc(String(r.countDate)):'')+delta;
    box.className='fld full loghint match';
  } else {
    const list=here.slice(0,3).map(function(r){ return esc(r.product||r.desc)+' ('+(Number(r.qty)||0).toLocaleString()+')'; }).join(', ');
    box.innerHTML='<span class="lh-i">📋</span> This spot last held: '+list+(here.length>3?', …':'')+'<br><span class="lh-note">Not this product — double-check the location.</span>';
    box.className='fld full loghint warn';
  }
  box.hidden=false;
}

/* ---- Count by row: pick a location, work through what the log had there last ---- */
// Timestamp in the same shape saveEntry uses.
function nowTs(){
  const n=new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')
    +' '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
}
// Find the lookup row (perUnit/weight/type) for a logged product, by code then description.
function lookupForProduct(product, desc){
  const idx=activeIdx(); let it=idx[norm(product)];
  if(it) return it;
  const list=activeList();
  return list.find(function(x){ return norm(x.desc)===norm(desc) || norm(x.desc)===norm(product) || norm(x.code)===norm(product); }) || null;
}
// Location from the row picker (mirror of composeLoc for the row fields).
function composeRowLoc(){
  const sel=$('rowBldg')?$('rowBldg').value:'';
  const raw=($('rowNum')&&$('rowNum').value||'').trim();
  const m=/^([A-Za-z]{1,2})[\s-]?(\d+)$/.exec(raw);
  let letter=sel, digits;
  if(m){ letter=m[1].toUpperCase(); digits=m[2]; } else { digits=raw.replace(/\D/g,''); }
  if(!digits) return letter||'';
  return (letter?letter+'-':'')+digits.padStart(3,'0');
}
function fillRowBuildings(){
  const sel=$('rowBldg'); if(!sel || sel.dataset.built) return; sel.dataset.built='1';
  sel.innerHTML=['<option value="">—</option>'].concat(BUILDINGS.map(function(b){ return '<option value="'+b[0]+'">'+b[0]+' · '+b[1]+'</option>'; })).join('');
  sel.value=state.building||'';
}
function onRowBldg(v){ state.building=v; persistSession(); const tb=$('topBldg'); if(tb) tb.value=v; }
// Switch between Scan and Count-by-row.
function setMode(mode){
  state.mode=mode;

  syncMode();

}
// Reflect the current mode in the UI (buttons, which panel shows). Safe to call anytime.
function syncMode(){
  const m=state.mode||'scan';
  const ms=$('modeScan'), mr=$('modeRow'); if(ms) ms.classList.toggle('on',m==='scan'); if(mr) mr.classList.toggle('on',m==='row');
  const sb=$('scanbay'); if(sb) sb.style.display=m==='scan'?'':'none';
  const bb=$('bldgBar'); if(bb) bb.style.display=m==='scan'?'':'none';
  const rp=$('rowPanel'); if(rp) rp.classList.toggle('hide', m!=='row');
  if(m==='row'){ fillRowBuildings(); renderRowPanel(); }
}
function loadRow(){ kpHide(); renderRowPanel(); }
// Step the row number up/down by one and reload — walk locations without retyping.
function rowStep(delta){
  const loc=composeRowLoc(); const p=parseLoc(loc);
  if(p.bldg && $('rowBldg') && !$('rowBldg').value){ $('rowBldg').value=p.bldg; }   // keep the building
  let n = p.num!=='' ? Number(p.num) : 0;
  n = Math.max(1, n+delta);
  const el=$('rowNum'); if(el){ el.value=String(n); }
  _kpFresh=false; kpHide();
  renderRowPanel();
}
// Session entries already recorded at this location (so we can tick counted products).
function countedAt(loc){ const key=logLocKey(loc); return activeEntries().filter(function(e){ return logLocKey(e.loc)===key; }); }
function rowIsCounted(counted, r){ return counted.some(function(e){ return norm(e.code)===norm(r.product) || (r.desc && norm(e.desc)===norm(r.desc)); }); }
function rowCountedEntry(counted, r){ return counted.find(function(e){ return norm(e.code)===norm(r.product) || (r.desc && norm(e.desc)===norm(r.desc)); }); }
function rowSkipKey(loc,i){ return logLocKey(loc)+'|'+i; }
// Show the target location on the Prev/Next buttons (e.g. "◀ S-006" / "S-008 ▶").
function updateRowStepLabels(){
  const prev=$('rowPrev'), next=$('rowNext'); if(!prev||!next) return;
  const p=parseLoc(composeRowLoc());
  const pad=x=>(p.bldg?p.bldg+'-':'')+String(x).padStart(3,'0');
  if(p.num!==''){ const n=Number(p.num); prev.textContent = n>1?('◀ '+pad(n-1)):'◀ Prev'; next.textContent = pad(n+1)+' ▶'; }
  else { prev.textContent='◀ Prev'; next.textContent='Next ▶'; }
}
function renderRowPanel(){
  fillRowBuildings();
  updateRowStepLabels();
  const info=$('rowInfo'), list=$('rowList'); if(!info||!list) return;
  const loc=composeRowLoc();
  if(!loc || parseLoc(loc).num===''){
    info.innerHTML='<div class="rowhint">Pick a building and enter the row/location number, then tap <b>Show</b>.</div>'; list.innerHTML=''; return;
  }
  if(!LOG_LOADED){
    info.innerHTML='<div class="rowhint warn">Last-count log isn’t loaded yet — nothing to pre-fill for <b>'+esc(loc)+'</b>.<br>You can still add items from the <b>Scan item</b> tab. (Check the log setup.)</div>';
    list.innerHTML='<button type="button" class="btn ghost rowadd" onclick="rowAddProduct()">+ Add a product here</button>'; return;
  }
  const rows=logForLoc(loc);
  const counted=countedAt(loc);
  const doneN=rows.filter(function(r){ return rowIsCounted(counted,r); }).length;
  info.innerHTML='<div class="rowhdr">Last count at <b>'+esc(loc)+'</b> · '+rows.length+' item'+(rows.length===1?'':'s')
    +(rows.length?' · <b>'+doneN+'</b> counted':'')+'</div>';
  let html='';
  rows.forEach(function(r,i){
    if(rowSkips[rowSkipKey(loc,i)]) return;   // marked "not here"
    html+=rowItemHtml(r,i,loc,counted);
  });
  if(!rows.length){ html='<div class="rowhint">Nothing was logged at <b>'+esc(loc)+'</b>.</div>'; }
  html+='<button type="button" class="btn ghost rowadd" onclick="rowAddProduct()">+ Add a product here</button>';
  list.innerHTML=html;
}
function rowItemHtml(r,i,loc,counted){
  const it=lookupForProduct(r.product,r.desc);
  const per=it?Number(it.perUnit)||0:0;
  const total=Number(r.qty)||0;
  const bd=unitsBreakdown(total, per);
  const done=rowIsCounted(counted,r);
  const de=done?rowCountedEntry(counted,r):null;
  const sub=(r.desc&&r.desc!==r.product?esc(r.desc)+' · ':'')+'last: <b>'+total.toLocaleString()+'</b> units'+(bd?' ('+bd+')':'');
  return '<div class="rowitem'+(done?' done':'')+'">'
    +'<div class="ri-main"><div class="ri-name">'+esc(r.product||r.desc)+'</div><div class="ri-sub">'+sub+'</div></div>'
    +(done
      ? '<div class="ri-done">✓ '+(Number(de&&de.total)||0).toLocaleString()+'</div>'
      : '<div class="ri-btns">'
          +'<button type="button" class="btn tiny ok" onclick="rowSame('+i+')">Same</button>'
          +'<button type="button" class="btn tiny" onclick="rowEdit('+i+')">Edit</button>'
          +'<button type="button" class="btn tiny x" onclick="rowSkip('+i+')" aria-label="Not here">✕</button>'
        +'</div>')
    +'</div>';
}
function rowEntryFor(r, loc, totalUnits){
  const it=lookupForProduct(r.product,r.desc);
  const per=it?Number(it.perUnit)||0:0;
  let full=0, extra=Number(totalUnits)||0;
  if(per>0){ full=Math.floor((Number(totalUnits)||0)/per); extra=(Number(totalUnits)||0)-full*per; }
  return {
    ts: nowTs(), counter: $('counterName').value.trim()||'—',
    category: state.dept==='plastics'?'Plastics':(state.metalKind==='ends'?'Ends':'Cans'),
    code: (it&&it.code)||r.product||'', desc: (it&&it.desc)||r.desc||r.product||'',
    weight: (it&&it.weight)||'', type: (it&&it.type)||'',
    per, full, extra, total: Math.round(full*per+extra), loc: loc
  };
}
var _rowSaving=false;
function appendCounted(entry){
  return callApi('appendEntry',[entry, state.dept]).then(function(){
    activeEntries().unshift(entry); persistSession(); renderRecent(); refreshEntries(); return true;
  });
}
// One-tap: the last count is still accurate — record it as this count.
function rowSame(i){
  if(_rowSaving) return; _rowSaving=true;
  const loc=composeRowLoc(); const r=logForLoc(loc)[i];
  if(!r){ _rowSaving=false; return; }
  const entry=rowEntryFor(r, loc, r.qty);
  if(entry.total<=0){ _rowSaving=false; toast('Nothing to record (0)','err'); return; }
  toast('Saving…');
  appendCounted(entry).then(function(){ _rowSaving=false; toast('Counted '+entry.total.toLocaleString()+' · '+esc(entry.code)); renderRowPanel(); })
    .catch(function(e){ _rowSaving=false; toast('Save failed — try again','err'); console.error(e); });
}
// Open the normal count card pre-filled with this product + location + last split, to adjust.
function rowEdit(i){
  const loc=composeRowLoc(); const r=logForLoc(loc)[i]; if(!r) return;
  const it=lookupForProduct(r.product,r.desc);
  const total=Number(r.qty)||0; const per=it?Number(it.perUnit)||0:0;
  let full=0, extra=total; if(per>0){ full=Math.floor(total/per); extra=total-full*per; }
  const item = it ? Object.assign({}, it) : { code:r.product, desc:r.desc||r.product, weight:'', type:'', perUnit:'', __manual:true };
  item.__prefill = { loc: loc, full: full, extra: extra };
  selectItem(item);
}
function rowSkip(i){ const loc=composeRowLoc(); rowSkips[rowSkipKey(loc,i)]=1; renderRowPanel(); }
// Add something the log didn't list: jump to Scan with this building preset.
function rowAddProduct(){

}

/* ---- pop-up calculator ---- */
// Remembers which count box was last active, so "Use this number" drops the
// result straight back into it.
var lastCountField=null;
var calcLast=null;                         // the most recent computed result
const CALC_HIST_KEY='invCalcHist_v1';      // { personName: ["12*24 = 288", ...] }
function calcPerson(){ return ($('counterName') && $('counterName').value.trim()) || '—'; }
function calcHistAll(){ try{ return JSON.parse(localStorage.getItem(CALC_HIST_KEY)||'{}'); }catch(_){ return {}; } }
function calcHistFor(p){ const a=calcHistAll()[p]; return Array.isArray(a)?a:[]; }
function calcHistPush(entry){
  const all=calcHistAll(), p=calcPerson();
  const list=(Array.isArray(all[p])?all[p]:[]).filter(x=>x!==entry); // no duplicates
  list.unshift(entry);

var _lockY=0;

function unlockScroll(){

// Evaluate only arithmetic; reject anything with letters or other characters.
function calcEval(raw){
  const expr=String(raw).replace(/×/g,'*').replace(/÷/g,'/').trim();
  if(!expr) return null;
  if(!/^[0-9+\-*/(). %]+$/.test(expr)) return null;
  try{
    const v=Function('"use strict";return ('+expr+')')();
    if(typeof v!=='number' || !isFinite(v)) return null;
    return Math.round(v*1e6)/1e6;          // trim float noise
  }catch(_){ return null; }
}
function calcEquals(){
  const d=$('calcDisplay'); const expr=d.value.trim();
  const v=calcEval(expr);
  if(v===null){ $('calcResult').textContent='?'; calcLast=null; return; }
  calcLast=v;
  $('calcResult').textContent=v.toLocaleString();
  d.value=String(v);                       // let them keep calculating from the result
  calcHistPush(expr+' = '+v.toLocaleString());
  renderCalcHist();
}
function calcUse(){
  // Make sure we have a value even if they didn't hit "="
  let v=calcLast;
  if(v===null){ v=calcEval($('calcDisplay').value); }
  if(v===null){ $('calcResult').textContent='?'; return; }
  // Fill whichever box the keypad is on (falls back to the last count box used).
  const id = (activeNumField && $(activeNumField)) ? activeNumField : ((lastCountField && $(lastCountField)) ? lastCountField : null);
  const target = id ? $(id) : null;
  if(target){
    target.value=String(v);
    target.dispatchEvent(new Event('input',{bubbles:true})); // fires calc() for the total
    activeNumField=id;
    closeCalc();                                             // refocuses the box → keypad returns
  } else {
    // No count box open — just show it so they can read/type it.
    $('calcResult').textContent=Number(v).toLocaleString()+'  (open an item first to auto-fill)';
  }
}
function renderCalcHist(){
  const box=$('calcHist'); const list=calcHistFor(calcPerson());
  if(!list.length){ box.innerHTML='<div class="none">No calculations yet.</div>'; return; }
  box.innerHTML=list.map(function(item){
    const parts=item.split(' = ');
    const rv=(parts.length>1?parts[parts.length-1]:item).replace(/,/g,'');
    return '<div class="h" onclick="reuseCalc(\''+esc(rv)+'\')">'
         +   '<span class="ex">'+esc(parts[0])+'</span><span class="rv">'+esc(rv)+'</span></div>';
  }).join('');
}

/* ---- save ---- */
var _saving=false;   // in-flight guard so a double-tap can't save the same count twice
async function saveEntry(){
  if(_saving) return;
  _saving=true;
  const per=asNum($('f_per').value), full=asNum($('f_full').value), extra=asNum($('f_extra').value);
  const total=Math.round(full*per+extra);
  const from=state.building||'';
  const to=($('f_to')?.value)||'';
  if(total<=0){ toast('Enter a quantity greater than 0','err'); _saving=false; return; }
  if(!from){ toast('Pick the From building (top of screen)','err'); _saving=false; return; }
  if(!to){ toast('Pick a To building','err'); _saving=false; return; }
  if(from===to){ toast('From and To must differ','err'); _saving=false; return; }
  const counter=$('counterName').value.trim()||'-';
  const code=($('f_code')?.value||'').trim();
  const desc=($('f_desc')?.value||'').trim();
  const weight=($('f_weight')?.value||'').trim();
  const type=($('f_type')?.value||'').trim();
  const category=(state.dept==='plastics'?'Plastics':'Metals');
  const noteBits=[full+'x'+per+(extra?('+'+extra):'')];
  if(type) noteBits.push('Type '+type);
  if(weight) noteBits.push('Wt '+weight);
  const movement={ user:counter, barcode:code, product:code||desc, desc:desc, kind:category,
    entryMethod:'Pallets', qtyEntered:full, unitsPerPallet:per, qtyEach:total,
    fromBuilding:from, toBuilding:to, note:noteBits.join(' | '),
    eventDate:new Date().toISOString().slice(0,10) };
  const btn=$('f_save'); const btnLabel=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='Saving...'; }
  callApi('logMovement',[movement]).then(function(res){
    _saving=false;
    const flags=(res&&res.flags)||'';
    activeEntries().unshift({code:code,desc:desc,category:category,per:per,full:full,extra:extra,total:total,from:from,to:to,flags:flags,counter:counter});
    persistSession(); renderRecent();
    toast('Saved \u00b7 '+total.toLocaleString()+' units'+(flags?' \u00b7 '+flags:''));
    clearCardOnly(); focusScan();
  }).catch(function(err){
    _saving=false;
    if(btn){ btn.disabled=false; btn.textContent=btnLabel||'\u2713 Save move'; }
    toast('Save failed - try again','err'); console.error(err);
  });
}

/* ---- load the counted list from the sheet (the source of truth) ---- *//* ---- load the counted list from the sheet (the source of truth) ---- */
var _refreshing=false;
function refreshEntries(){
  return Promise.resolve();   // movements are an append-only log — nothing to pull back into the list
  if(_refreshing) return Promise.resolve();
  _refreshing=true;
  const rb=$('refreshBtn'); if(rb) rb.textContent='Refreshing…';
  return callApi('getEntries', []).then(function(res){
    const rev = a => Array.isArray(a) ? a.slice().reverse() : [];   // sheet is oldest-first → newest-first
    const cans=rev(res.cans), ends=rev(res.ends);
    state.entries.plastics = rev(res.plastics);
    state.entries.metals   = cans.concat(ends).sort((a,b)=> a.ts<b.ts?1:(a.ts>b.ts?-1:0));
    persistSession();                 // keep a local cache for offline / crash fallback
    if(state.dept) renderRecent();
  }).catch(function(err){
    console.error(err);
    if(state.dept) renderRecent();    // fall back to the cached list
    toast('Couldn’t reach the sheet — showing cached list','err');
  }).finally(function(){
    _refreshing=false;
    const b=$('refreshBtn'); if(b) b.textContent='Refresh';
  });
}

/* ---- recent list + export ---- */
function renderRecent(){
  const list=activeEntries();
  $('sessCount').textContent=list.length;
  const el=$('recentList');
  if(!list.length){ el.innerHTML='<div class="empty-recent">Saved moves will appear here after you save them.</div>'; return; }
  el.innerHTML=list.map(function(e){ return '<div class="entry"><div class="info">'
    +'<div class="c">'+esc(e.code||'no barcode')+' \u00b7 <span style="opacity:.7">'+esc(e.category)+'</span></div>'
    +'<div class="d">'+esc(e.desc)+'</div>'
    +'<div class="loc">'+esc(e.from||'?')+' \u2192 '+esc(e.to||'?')+(e.flags?' \u00b7 <span style="color:#B26A00;font-weight:700">'+esc(e.flags)+'</span>':'')+'</div>'
    +'</div><div class="qty">'+(Number(e.total)||0).toLocaleString()+'<small>UNITS</small></div></div>'; }).join('');
}
function clearSession(){
  const list=activeEntries();
  if(list.length && !confirm('Clear the '+list.length+' item(s) in this session list?\n\nYour saved rows in the Google Sheet are NOT affected.')) return;
  if(state.dept==='plastics') state.entries.plastics=[]; else state.entries.metals=[];
  persistSession(); renderRecent(); focusScan();
}
function exportCSV(){
  const list=activeEntries(); if(!list.length) return;
  let header, rows;
  if(state.dept==='plastics'){
    header=['Timestamp','Counter','Item #','Description','Type','Per Unit','Full','Extra','Location','Total'];
    rows=list.map(e=>[e.ts,e.counter,e.code,e.desc,e.type,e.per,e.full,e.extra,e.loc,e.total]);
  }else{
    header=['Timestamp','Counter','Category','Code','Description','Weight','Type','Per Unit','Full','Extra','Location','Total'];
    rows=list.map(e=>[e.ts,e.counter,e.category,e.code,e.desc,e.weight,e.type,e.per,e.full,e.extra,e.loc,e.total]);
  }
  const csv=[header,...rows].map(r=>r.map(c=>{
    const s=(c??'').toString(); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(state.dept==='plastics'?'Plastics':'Metals')+'_count_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}


/* ---- load lookup data from the Sheet on startup ---- */
function onData(payload){
  DATA = payload; buildIndex();
  const foot=document.getElementById('landingFoot');
  if(foot) foot.textContent = allProductCount().toLocaleString()+' products \u00b7 '+BUILDINGS.length+' buildings loaded';
  updateHints();
}
function onDataFail(err){
  const foot=document.getElementById('landingFoot'); if(foot) foot.textContent='Could not load item lists — reload the page.';
  const hint=$('scanCountHint'); if(hint) hint.textContent='Could not load products — reload the page.';
  toast('Could not load products — reload','err');
  console.error(err);
}
Promise.all([callApi('getLookups',[]), callApi('getBuildings',[])]).then(function(r){
  BUILDINGS = r[1]||[];
  initBuildingSelect();     // populate the "From building" dropdown from the Buildings tab
  onData(r[0]);
}).catch(onDataFail);

/* ---- toast ---- */
let toastT;
function toast(msg,type){
  const t=$('toast'); t.textContent=msg; t.className='show'+(type==='err'?' err':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='',1800);
}

/* Keep taps in the GAPS between keys from blurring the field (which hides the pad) or scrolling.
   The buttons preventDefault themselves; the pad background did not, so a near-miss tap landed on
   the container, blurred the input, and closed the keyboard. Swallow those stray taps here. */
['cardKeypad','textKeypad'].forEach(function(id){
  var pad=document.getElementById(id);
  if(pad){ pad.addEventListener('pointerdown', function(ev){
    if(ev.target.closest('button')) return;   // real key press — let its own handler run
    ev.preventDefault();                        // gap/edge tap — don't move focus or scroll
  }, {passive:false}); }
});

/* Rotating the phone can leave the docked keypad mis-sized (stuck tall). When orientation/size
   changes while a pad is open, rebuild its layout for the new width and re-seat the active field. */
(function(){
  var reflowTO=null;
  function reflowPad(){
    var tk=$('textKeypad'), kp=$('cardKeypad');
    var tkOpen=tk&&tk.classList.contains('show'), kpOpen=kp&&kp.classList.contains('show');
    if(!tkOpen && !kpOpen) return;
    var g=$('tkGrid'); if(g){ g.dataset.built=''; if(tkOpen) tkBuild(); }   // re-lay-out for new width
    var id = tkOpen ? activeTextField : activeNumField;
    var el = id && $(id);
    if(el){ setTimeout(function(){ scrollFieldUp(el, id==='f_loc'?'.total-strip':null); }, 80); }
  }
  function schedule(){ clearTimeout(reflowTO); reflowTO=setTimeout(reflowPad, 250); }
  window.addEventListener('orientationchange', schedule);
  window.addEventListener('resize', schedule);
})();

/* show the build/version tag */
$('buildTag').textContent = APP_VERSION;

/* ---- persist counter name + resume the saved session on open ---- */
$('counterName').addEventListener('input', persistSession);
restoreSession(loadSession());
enterApp();               // skip the landing screen — one combined scan box
initBuildingSelect();
</script>
